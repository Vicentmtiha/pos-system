<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongeza Mtumiaji Mpya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold">Ongeza Mtumiaji Mpya</h5>
            </div>
            <div class="card-body p-4">
                <form action="/users/add" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Majina Kamili</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Mf. Juma Hamisi" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Jina la Kuingilia (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="Mf. juma01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nenosiri (Password)</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Wadhifa (Role)</label>
                        <select name="role" class="form-select">
                            <option value="CASHIER">Cashier (Muuzaji)</option>
                            <option value="ADMIN">Admin (Msimamizi)</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/users" class="btn btn-secondary">Rudi</a>
                        <button type="submit" class="btn btn-success px-4">Hifadhi Mtumiaji</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
