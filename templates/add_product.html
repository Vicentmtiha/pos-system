<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>{% if product %}Hariri Bidhaa{% else %}Ongeza Bidhaa{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">POS System</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/categories">Categories</a>
                <a class="nav-link active" href="/products">Products</a>
                <a class="nav-link" href="/customers">Customers</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">{% if product %}Hariri Bidhaa{% else %}Ongeza Bidhaa Mpya{% endif %}</h4>
                    </div>
                    <div class="card-body">
                        <form action="{% if product %}/products/edit/{{ product.id }}{% else %}/products/add{% endif %}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Jina la Bidhaa</label>
                                <input type="text" class="form-control" name="name" value="{{ product.name if product else '' }}" required>
                            </div>
                            
                            <!-- Eneo la Cost Price limeongezwa hapa -->
                            <div class="mb-3">
                                <label class="form-label">Bei ya Kununulia - Cost Price (TSH)</label>
                                <input type="number" step="0.01" class="form-control" name="cost_price" value="{{ product.cost_price if product else '0.0' }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Bei ya Kuuzia - Selling Price (TSH)</label>
                                <input type="number" step="0.01" class="form-control" name="price" value="{{ product.price if product else '' }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Idadi (Quantity)</label>
                                <input type="number" class="form-control" name="quantity" value="{{ product.quantity if product else '' }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" name="category_id" required>
                                    <option value="" disabled {% if not product %}selected{% endif %}>Chagua Category...</option>
                                    {% for category in categories %}
                                        <option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>
                                            {{ category.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/products" class="btn btn-secondary">Ghairi</a>
                                <button type="submit" class="btn btn-success">Hifadhi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
