<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Categories</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-light">

    <div class="container my-5">
        
        <!-- Kichwa cha Habari na Kitufe cha Kuongeza -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-list-alt me-2"></i>Categories</h2>
            <a href="/categories/add" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Add New Category
            </a>
        </div>

        <!-- Jedwali (Table) lenye muundo wa Card na Kivuli -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="py-3 ps-3">ID</th>
                                <th class="py-3">Name</th>
                                <th class="py-3">Description</th>
                                <th class="py-3">Created At</th>
                                <th class="py-3 text-end pe-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for category in categories %}
                            <tr>
                                <td class="ps-3 fw-semibold">{{ category.id }}</td>
                                <td>{{ category.name }}</td>
                                <td class="text-muted">{{ category.description or '' }}</td>
                                <td>{{ category.created_at.strftime("%Y-%m-%d") }}</td>
                                <td class="text-end pe-3">
                                    <a href="/categories/edit/{{ category.id }}" class="btn btn-sm btn-outline-warning me-1">
                                        <i class="fas fa-edit"></i> Edit
                                    </a>
                                    <form action="/categories/delete/{{ category.id }}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?');">
                                            <i class="fas fa-trash-alt"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Rudi kwenye Dashboard -->
        <div class="mt-4">
            <a href="/" class="text-decoration-none text-secondary">
                <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
