<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% if customer %}Edit{% else %}Add{% endif %} Customer</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<h1>{% if customer %}Edit{% else %}Add{% endif %} Customer</h1>
<form method="post" action="{% if customer %}/customers/edit/{{ customer.id }}{% else %}/customers/add{% endif %}">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required value="{{ customer.name if customer else '' }}"><br><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" value="{{ customer.email if customer else '' }}"><br><br>
    <label for="phone">Phone:</label><br>
    <input type="text" id="phone" name="phone" value="{{ customer.phone if customer else '' }}"><br><br>
    <button type="submit">{% if customer %}Update{% else %}Add{% endif %} Customer</button>
</form>
<a href="/customers">Back to Customers</a>
</body>
</html>
